name: verify
on:
  push:
    branches: [main]
  pull_request:

# 最小权限：本 workflow 只读仓库内容，不需要写任何东西。
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest          # x86-64，与服务器同平台
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive      # 带 submodule 检出
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # 1. pin 一致性（清单与校验逻辑收敛在 scripts/check-pins.sh，
      #    与 scripts/release.sh、Jenkins 侧共用同一实现；未推送 commit 会失败）
      - name: Check submodule pins
        run: bash scripts/check-pins.sh
      # 1.5 shellcheck 静态检查（本地以 0.11.0 -S style 全绿；CI 固定同版本语义）
      - name: ShellCheck scripts
        run: |
          set -eu
          scversion="v0.11.0"
          asset="shellcheck-${scversion}.linux.x86_64.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/${scversion}/${asset}"
          # 校验和是**信任锚点**：校验后我们执行的是这个确定的字节序列，而不是「当前 URL 上的内容」。
          # ⚠️ 来源说明：shellcheck 的 release **未提供** SHA256SUMS 资产，故该值系首次下载官方
          #    归档后本地计算（TOFU）。它能防「同一 URL 上的资产被替换/回归」，**不构成**对首次
          #    下载的独立验证。升级 scversion 时必须同步更新此值。
          sha256_expected="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          curl -fsSL -o "$asset" "$url"
          echo "${sha256_expected}  ${asset}" | sha256sum -c -
          tar -xJf "$asset"
          "shellcheck-${scversion}/shellcheck" -S style scripts/*.sh deploy/remote-install.sh
      # 2. 冒烟：make setup（真实构建）+ link 插件 + 起服务健康检查
      - name: Setup
        run: make setup
      - name: Link plugins into profile
        env:
          DSH_HOME: ${{ github.workspace }}/.dsh
        run: bash scripts/link-plugins.sh
      - name: Smoke test DSH Web
        env:
          DSH_HOME: ${{ github.workspace }}/.dsh
        run: |
          (cd harness && pnpm dsh --profile dsh --no-open >/tmp/dsh.log 2>&1) &
          for i in $(seq 1 60); do
            # harness 对未认证请求返回 401（认证 gate 在响应 = 服务已就绪），
            # 303 跳认证页亦正常，故 200/303/401 均视为通过。
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/ || true)
            case "$code" in 200|303|401) exit 0 ;; esac
            sleep 2
          done
          cat /tmp/dsh.log; exit 1
