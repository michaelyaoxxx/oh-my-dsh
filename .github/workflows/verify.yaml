name: verify
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest          # x86-64，与服务器同平台
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive      # 带 submodule 检出
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 1. pin 一致性（复用 release.sh 校验逻辑；未推送 commit 会失败）
      - name: Check submodule pins match remote stable branches
        run: |
          set -e
          for pair in "harness master" "plugins/dsh-web main" "plugins/dsh-plugin-mineru master"; do
            set -- $pair
            git -C "$1" fetch origin "$2"
            [ "$(git -C "$1" rev-parse HEAD)" = "$(git -C "$1" rev-parse origin/$2)" ] \
              || { echo "$1 pin 与 $2 不一致（可能未推送）"; exit 1; }
          done
      # 1b. tag-pin 一致性（dsh-better-sidebar pin 正式发布 tag；tag 存在于远端即已发布，
      #     与分支比对的「拦截本地未推送 commit」同语义）
      - name: Check tag-pinned submodules
        run: |
          set -e
          for pair in "plugins/dsh-better-sidebar v0.18.0"; do
            set -- $pair
            git -C "$1" fetch origin "refs/tags/$2"
            [ "$(git -C "$1" rev-parse HEAD)" = "$(git -C "$1" rev-parse "$2")" ] \
              || { echo "$1 pin 与 tag $2 不一致（可能未推送）"; exit 1; }
          done
      # 1.5 shellcheck 静态检查（本地以 0.11.0 -S style 全绿；CI 固定同版本语义）
      - name: ShellCheck scripts
        run: |
          scversion="v0.11.0"
          wget -qO- "https://github.com/koalaman/shellcheck/releases/download/${scversion}/shellcheck-${scversion}.linux.x86_64.tar.xz" | tar -xJ
          "shellcheck-${scversion}/shellcheck" -S style scripts/*.sh deploy/remote-install.sh
      # 2. 冒烟：make setup（真实构建）+ link 插件 + 起服务健康检查
      - name: Setup
        run: make setup
      - name: Link plugins into profile
        env:
          DSH_HOME: ${{ github.workspace }}/.dsh
        run: bash scripts/link-plugins.sh
      - name: Smoke test DSH Web
        env:
          DSH_HOME: ${{ github.workspace }}/.dsh
        run: |
          (cd harness && pnpm dsh --profile dsh --no-open >/tmp/dsh.log 2>&1) &
          for i in $(seq 1 60); do
            # harness 对未认证请求返回 401（认证 gate 在响应 = 服务已就绪），
            # 303 跳认证页亦正常，故 200/303/401 均视为通过。
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/ || true)
            case "$code" in 200|303|401) exit 0 ;; esac
            sleep 2
          done
          cat /tmp/dsh.log; exit 1
